[project]
name = "tfplan-mcp"
version = "0.1.0"
description = "MCP server that lets an AI read and risk-review a Terraform/OpenTofu plan (terraform show -json) safely: summary, ranked risks, masked attribute diffs, replace explanations, plan comparison. Read-only; never runs terraform."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0"]
keywords = ["mcp", "terraform", "opentofu", "plan", "iac", "security-review", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/tfplan-mcp"

[project.scripts]
tfplan-mcp = "tfplan_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfplan_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = ["real_terraform: needs a local terraform/tofu binary; skipped unless TFPLAN_REAL_TERRAFORM=1"]
